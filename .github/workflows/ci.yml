name: CI/CD Pipeline

on:
  push: 
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with: 
          java-version: '25'

      - name: Build with Maven
        run: mvn clean install

      - name: Docker build
        run: docker build -t run-api

      - name: Docker run (test)
        run: docker run --rm -p 9090:9090 run-api
          
        


